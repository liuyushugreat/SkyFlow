model:
  num_layers: 2
  embed_dim: 64
  num_heads: 4
  temporal_dim: 32
  recurrent_dim: 64
  dropout: 0.1
  num_relation_types: null
  use_temporal: true
  use_gating: true
  use_gru: true
  use_conformance_gate: true
data:
  num_uavs: 500
  num_sectors: 64
  num_weather_cells: 36
  num_restricted_zones: 12
  uav_feature_dim: null
  sector_feature_dim: 8
  weather_feature_dim: 12
  observation_window: 10
  lookahead_seconds: 30.0
  conflict_h_sep_m: 10.0
  conflict_v_sep_m: 3.0
  sim_freq_hz: 10.0
  grid_size_m: 5000.0
  scenario_minutes_train: 3360
  scenario_minutes_val: 720
  scenario_minutes_test: 720
  train_scenarios: 40
  val_scenarios: 10
  test_scenarios: 10
  scenario_duration_s: 60.0
  sim_seed: 42
  cache_dir: cache
training:
  epochs: 150
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  gradient_clip_norm: 1.0
  focal_gamma: 2.0
  focal_alpha: 0.75
  loss: bce
  conflict_threshold: 0.42
  warmup_steps: 200
  scheduler: warmup_cosine
  tbptt_detach: false
  state_carry: window
  seed: 123
  num_seeds: 5
  seeds:
  - 42
  - 123
  - 456
  - 789
  - 1024
  device: auto
  early_stopping_patience: 15
  min_epochs: 30
  threshold_mode: val
  eval_every: 1
  batch_windows: 1
  micro_batch_windows: 1
  amp: false
  tf32: true
  regime_ttc_boundary_s: 15.0
features:
  leakage_free: true
  input_set: full
  normalize_inputs: true
  pair_edge_features: geometry_plan_sync
  plan_context: true
labels:
  mode: lookahead
temporal:
  delta_mode: aoi
sim:
  observation_model: adsb
  density_preset: dense
  cause_mix:
    planned_crossing: 0.8
    nonconforming: 0.08
    wind_deviation: 0.06
    priority_insertion: 0.03
    noncooperative: 0.03
  adsb_latency_s:
  - 0.5
  - 1.2
  packet_loss: 0.0
  link_mix:
    packet_loss:
    - 0.0
    - 0.3
    latency_lo_s:
    - 0.3
    - 0.8
    latency_hi_s:
    - 1.0
    - 3.0
  gps_cep_m: 2.5
  weather_update_s: 5.0
  registry_update_s: 10.0
  corridor_update_s: 1.0
graph:
  neighbor_search: grid
