model:
  num_layers: 4
  embed_dim: 128
  num_heads: 4
  temporal_dim: 32
  recurrent_dim: 64
  dropout: 0.1
  # num_relation_types is derived from features.leakage_free (5) unless set here.

data:
  num_uavs: 500
  num_sectors: 64
  num_weather_cells: 36
  num_restricted_zones: 12
  # uav_feature_dim is derived from features.leakage_free (20) unless set here.
  sector_feature_dim: 8
  weather_feature_dim: 12
  observation_window: 10
  lookahead_seconds: 30.0
  conflict_h_sep_m: 10.0
  conflict_v_sep_m: 3.0
  sim_freq_hz: 10.0
  grid_size_m: 5000.0
  scenario_minutes_train: 3360
  scenario_minutes_val: 720
  scenario_minutes_test: 720

features:
  leakage_free: true        # false reproduces the MobiHoc-submission feature set
  input_set: full           # full | telemetry_only

labels:
  mode: lookahead           # lookahead (30 s window) | instantaneous (legacy)

temporal:
  delta_mode: aoi           # aoi (age of information) | legacy (time since edge last seen)

graph:
  neighbor_search: grid     # grid (spatial hash, cell = D_appr + 2*v_max*T) | bruteforce

scoring:
  candidates: proximity     # proximity (pairs able to conflict within the window) | edges | all | sampled (legacy)
  proximity_margin_m: 50.0  # slack for GPS noise / speed changes

baselines:
  cpa_rule_thresholds: val_search   # val_search (grid-search d_h, d_v on val by F1) | label (10 m / 3 m)

sim:
  observation_model: adsb   # adsb (latency + loss + GPS noise) | legacy (observation == truth)
  density_preset: dense     # dense (4 altitude layers, hub-converging waypoints, N*5 m start area) | legacy
  cause_mix:                # synthetic conflict-cause injection (per-UAV shares); null disables
    planned_crossing: 0.80
    nonconforming: 0.08     # flown targets offset 100-300 m from the filed plan
    wind_deviation: 0.06    # persistent 2-4 m/s cross-track drift
    priority_insertion: 0.03  # emergency flight entering at t=10-30 s straight through a hub
    noncooperative: 0.03    # no ADS-B: +3 s surveillance latency, 4x position noise
  adsb_latency_s: [0.5, 1.2]  # per-UAV link latency, scalar or [lo, hi]
  packet_loss: 0.0          # per-report loss probability
  gps_cep_m: 2.5
  weather_update_s: 5.0
  registry_update_s: 10.0
  corridor_update_s: 1.0

training:
  epochs: 150
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  focal_gamma: 2.0
  conflict_threshold: 0.42
  warmup_steps: 1000
  seed: 42
  num_seeds: 5
  seeds: [42, 123, 456, 789, 1024]
  device: auto

output_dir: outputs
